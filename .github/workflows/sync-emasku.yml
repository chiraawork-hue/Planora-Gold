name: Sync EMASKU buyback
on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: planora-price-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch dated EMASKU buyback prices
        run: python scripts/update_emasku.py
      - name: Commit feed when changed
        run: |
          if ! git diff --quiet -- data/buyback.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/buyback.json
            git commit -m "Update EMASKU official buyback prices"
            git pull --rebase
            git push
          fi
