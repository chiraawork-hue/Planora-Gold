name: Update EMASKU buyback
on:
  schedule:
    - cron: '25 2,6,10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-price-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser automation
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Read official rendered GOLD buyback table
        run: |
          for attempt in 1 2 3; do
            if python scripts/update_emasku_buyback.py; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 40; fi
          done
          echo 'HRTA data unavailable; previous verified quotes preserved.'
          exit 1
      - name: Commit verified prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/buyback.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official EMASKU buyback"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
