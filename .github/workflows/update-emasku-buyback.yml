name: Update EMASKU buyback
on:
  schedule:
    - cron: '25 2,6,10 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse verified dated EMASKU buyback table
        run: python scripts/update_emasku_buyback.py
      - name: Commit verified prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/buyback.json
          git diff --cached --quiet || (git commit -m "Update official EMASKU buyback" && git push)
