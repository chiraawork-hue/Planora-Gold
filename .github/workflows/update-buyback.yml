name: Update verified gold buyback prices
on:
  schedule:
    - cron: '25 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate UBS buyback quotes
        run: python scripts/update_buyback.py
      - name: Commit verified prices only if changed
        run: |
          if ! git diff --quiet -- data/buyback.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/buyback.json
            git commit -m "Update verified UBS buyback prices"
            git push
          fi
